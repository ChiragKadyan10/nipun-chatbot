server:
  port: 8084

spring:
  application:
    name: whatsapp-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:nipun_token}
  app-secret: ${WHATSAPP_APP_SECRET:nipun_app_secret}
  token: ${WHATSAPP_GRAPH_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  mock: ${WHATSAPP_MOCK:true}
