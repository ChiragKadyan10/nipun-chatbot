server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-school-service-schools
          uri: ${USER_SCHOOL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/schools/**
        - id: user-school-service-teachers
          uri: ${USER_SCHOOL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/teachers/**
        - id: curriculum-service
          uri: ${CURRICULUM_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/curriculum/**
        - id: whatsapp-service
          uri: ${WHATSAPP_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/whatsapp/**
        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/media/**
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/ai/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/chat/**
        - id: scheduling-service
          uri: ${SCHEDULING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/schedules/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/analytics/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/admin/**
