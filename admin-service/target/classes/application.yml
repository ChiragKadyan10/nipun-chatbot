server:
  port: 8080

spring:
  application:
    name: admin-service

services:
  user-school:
    url: ${SERVICES_USER_SCHOOL_URL:http://localhost:8082}
  curriculum:
    url: ${SERVICES_CURRICULUM_URL:http://localhost:8083}
  scheduling:
    url: ${SERVICES_SCHEDULING_URL:http://localhost:8088}
  analytics:
    url: ${SERVICES_ANALYTICS_URL:http://localhost:8089}

jwt:
  secret: ${JWT_SECRET:nipun-secure-high-entropy-jwt-secret-key-that-exceeds-256-bits-for-security}
  expiration: ${JWT_EXPIRATION:86400000} # 24 Hours
