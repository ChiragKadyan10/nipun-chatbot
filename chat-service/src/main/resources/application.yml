server:
  port: 8087

spring:
  application:
    name: chat-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nipun_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chat-processor-group-v3
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

services:
  user-school:
    url: ${USER_SCHOOL_SERVICE_URL:http://localhost:8082}
    username: ${USER_SCHOOL_SERVICE_USERNAME:internal}
    password: ${USER_SCHOOL_SERVICE_PASSWORD:internal123}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8086}
    username: ${AI_SERVICE_USERNAME:internal}
    password: ${AI_SERVICE_PASSWORD:internal123}